<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no" name="viewport"/>
    <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
    <title>ArgusAR Camera</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            font-family: 'Helvetica', sans-serif;
            overflow: hidden;
            background: #000;
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #container {
            position: relative;
            width: 100%;
            height: 100%;
            display: block;
            overflow: hidden;
            line-height: 0;
        }

        #container > * {
            position: absolute;
            display: block;
            user-select: none;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            animation: fadeIn 1.2s;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        #container > video {
            object-fit: cover;
            object-position: 50% 50%;
        }

        #splash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            opacity: 1;
        }

        #overlay {
            position: absolute;
            font-size: 16px;
            z-index: 2;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.5);
        }

        #overlay::before{
            position: absolute;
            width: 100%;
            white-space: pre-wrap;
            content: "Please allow access \A to your camera.";
            top:calc(50% + 50px);
            text-align: center;
            color: #949494;
        }

        #overlay button {
            background: transparent;
            border: 1px solid rgb(255, 255, 255);
            border-radius: 4px;
            color: #ffffff;
            padding: 12px 18px;
            text-transform: uppercase;
            cursor: pointer;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
            }
            50% {
                opacity: 0.6;
            }
            100% {
                opacity: 1;
            }
        }

        @media screen and (max-device-width: 480px) and (orientation: landscape) {
            #container {
                display: none;
            }

            body::before {
                content: "Rotate device to portrait mode.";
                color: white;
            }
        }

        @media screen and (max-device-width: 480px) and (orientation: portrait) {
            #container {
                display: block;
            }

            body::before {
                content: none;
            }
        }
    </style>
</head>
<body>
<div id="container"></div>
<div id="overlay">
    <button id="start_button">Start</button>
    <div id="splash"></div>
</div>
<script type="module">
    import * as THREE from 'https://threejsfundamentals.org/threejs/resources/threejs/r132/build/three.module.js';
    import { Stats } from "./assets/stats.js";
    import { ArgusAR } from './assets/argus_ar.js?v=b8';
    import { ArgusARConnectorTHREE } from './assets/argus_ar_three.js';
    import { ARCamView } from "./assets/view.js";
    import { Camera, onFrame, resize2cover } from "./assets/utils.js";
    import { IMUScaleEstimator } from './assets/scale_estimator.js';

    const PALETTE = [ 0x4dabf7, 0x51cf66, 0xffd43b, 0xff6b6b, 0xb197fc, 0xf783ac, 0x63e6be, 0xffa94d ];

    // Hull is in plane-local (u, v) coords; build local geometry on the XZ
    // plane and place the group via the same applyPose pathway as any object.
    function buildPlaneGroup( plane, applyPose )
    {
        const color = PALETTE[plane.id % PALETTE.length];
        const group = new THREE.Group();
        group.planeViz = true;

        if( plane.hull.length >= 3 )
        {
            const verts = plane.hull.map( p => new THREE.Vector3( p.u, 0, p.v ) );
            const positions = [];

            for( let i = 1; i < verts.length - 1; i++ )
            {
                positions.push( verts[0].x, verts[0].y, verts[0].z );
                positions.push( verts[i].x, verts[i].y, verts[i].z );
                positions.push( verts[i + 1].x, verts[i + 1].y, verts[i + 1].z );
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute( 'position', new THREE.Float32BufferAttribute( positions, 3 ) );

            group.add( new THREE.Mesh( geo, new THREE.MeshBasicMaterial( {
                color: color,
                transparent: true,
                opacity: 0.25,
                side: THREE.DoubleSide,
                depthWrite: false
            } ) ) );

            const outlineGeo = new THREE.BufferGeometry().setFromPoints( [ ...verts, verts[0] ] );
            group.add( new THREE.Line( outlineGeo, new THREE.LineBasicMaterial( { color: color } ) ) );
        }

        applyPose( plane.pose, group.quaternion, group.position );

        return group;
    }

    function main()
    {
        const config = {
            video: {
                facingMode: 'environment',
                aspectRatio: 16 / 9,
                width: { ideal: 1280 }
            },
            audio: false
        }

        const $container = document.getElementById( 'container' );
        const $view = document.createElement( 'div' );
        const $canvas = document.createElement( 'canvas' );
        const $overlay = document.getElementById( 'overlay' );
        const $start = document.getElementById( 'start_button' );
        const $splash = document.getElementById( 'splash' );
        const splashFadeTime = 800;

        $splash.style.transition = `opacity ${ splashFadeTime / 1000 }s ease`;
        $splash.style.opacity = 0;

        async function demo( media )
        {
            const $video = media.el;

            const size = resize2cover( $video.videoWidth, $video.videoHeight, $container.clientWidth, $container.clientHeight );

            $canvas.width = $container.clientWidth;
            $canvas.height = $container.clientHeight;
            $video.style.width = size.width + 'px';
            $video.style.height = size.height + 'px';

            const ctx = $canvas.getContext( '2d', { alpha: false, desynchronized: true } );
            // typical phone rear camera is ~65 deg horizontal (the old 45 deg
            // guess systematically warps the geometry); override with ?fov=
            const fov = parseFloat( new URLSearchParams( location.search ).get( 'fov' ) || '65' );
            const argus = await ArgusAR.Initialize( $canvas.width, $canvas.height, fov );
            const view = new ARCamView( $view, $canvas.width, $canvas.height );

            const applyPose = ArgusARConnectorTHREE.Initialize( THREE );

            // metric scale: loosely-coupled IMU/vision alignment (Phase 4 L1)
            const scaleEstimator = new IMUScaleEstimator();
            let metersPerUnit = null;
            let scaleConfidence = 0;

            window.addEventListener( 'devicemotion', ( e ) =>
            {
                const a = e.accelerationIncludingGravity;

                if( a && a.x !== null )
                {
                    scaleEstimator.feedIMU( performance.now(), a.x, a.y, a.z );
                }
            } );

            // One-Euro-style pose filter: heavy smoothing at rest, light
            // smoothing under fast motion — kills visible pose jitter
            const targetQ = new THREE.Quaternion();
            const targetP = new THREE.Vector3();
            const smoothQ = new THREE.Quaternion();
            const smoothP = new THREE.Vector3();
            let filterInit = false;

            function smoothedCameraPose( pose )
            {
                applyPose( pose, targetQ, targetP );

                if( !filterInit )
                {
                    smoothQ.copy( targetQ );
                    smoothP.copy( targetP );
                    filterInit = true;
                }
                else
                {
                    const speed = smoothP.distanceTo( targetP );
                    const aPos = Math.min( 1, 0.25 + speed * 6 );
                    const aRot = Math.min( 1, 0.3 + 8 * Math.abs( 1 - smoothQ.dot( targetQ ) ) * 20 );
                    smoothP.lerp( targetP, aPos );
                    smoothQ.slerp( targetQ, aRot );
                }

                view.camera.position.copy( smoothP );
                view.camera.quaternion.copy( smoothQ );
                view.object.visible = true;
            }

            Stats.add( 'total' );
            Stats.add( 'video' );
            Stats.add( 'slam' );

            $container.appendChild( $canvas );
            $container.appendChild( $view );

            document.body.appendChild( Stats.el );

            // plane HUD + reset button
            const $hud = document.createElement( 'div' );
            $hud.style.cssText = 'position:absolute;top:5px;right:5px;z-index:3;color:#fff;font:11px Arial;text-align:right;background:rgba(0,0,0,0.4);padding:5px;border-radius:4px;';
            $hud.textContent = 'planes: –';
            document.body.appendChild( $hud );

            const $reset = document.createElement( 'button' );
            $reset.textContent = 'Reset';
            $reset.style.cssText = 'position:absolute;bottom:12px;left:12px;z-index:3;color:#fff;background:rgba(0,0,0,0.4);border:1px solid #fff;border-radius:4px;padding:8px 14px;';
            $reset.addEventListener( 'click', ( e ) =>
            {
                e.stopPropagation();
                argus.reset();
                scaleEstimator.reset();
                metersPerUnit = null;
                scaleConfidence = 0;
                filterInit = false;
                view.scene.children.filter( o => o.placed || o.planeViz ).forEach( o => view.scene.remove( o ) );
            } );
            document.body.appendChild( $reset );

            const planeGroups = [];

            function refreshPlanes()
            {
                const planes = argus.getPlanes();

                planeGroups.forEach( g => view.scene.remove( g ) );
                planeGroups.length = 0;

                for( const plane of planes )
                {
                    const group = buildPlaneGroup( plane, applyPose );
                    view.scene.add( group );
                    planeGroups.push( group );
                }

                const planeList = ( planes.length === 0 )
                                  ? 'planes: none yet'
                                  : planes.map( p => `#${ p.id } ${ p.type } (${ p.inliers })` ).join( '<br/>' );

                const ls = argus.getLoopStats();
                const scaleLine = metersPerUnit
                                  ? `scale: ${ ( metersPerUnit * 100 ).toFixed( 1 ) }cm/u (${ ( scaleConfidence * 100 ) | 0 }%)`
                                  : 'scale: move the phone…';

                $hud.innerHTML = planeList
                    + `<br/>kf:${ ls.keyframes } cand:${ ls.candidates } rej:${ ls.verifyRejects }`
                    + `<br/>loops: ${ ls.loops } (${ ls.lastStatus })`
                    + `<br/>${ scaleLine }`;
            }

            // tap to hit-test & place an object on a plane
            $container.addEventListener( 'click', ( event ) =>
            {
                const hit = argus.hitTest( event.clientX, event.clientY );

                if( hit )
                {
                    // 0.15 m cube when the metric scale is known; fallback 0.4 slam units
                    const s = metersPerUnit ? ( 0.15 / metersPerUnit ) : 0.4;
                    const base = new THREE.Mesh(
                        new THREE.PlaneGeometry( s, s ),
                        new THREE.MeshBasicMaterial( { color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.15 } )
                    );
                    const cube = new THREE.Mesh(
                        new THREE.BoxGeometry( s * 0.25, s * 0.25, s * 0.25 ),
                        new THREE.MeshNormalMaterial( { flatShading: true } )
                    );
                    cube.position.z = s * 0.125;
                    base.add( cube );
                    base.placed = true;

                    applyPose( hit.pose, base.quaternion, base.position );
                    view.scene.add( base );
                    argus.createAnchor( hit.pose );
                }
            } );

            let frameCount = 0;

            onFrame( () =>
            {
                Stats.next();
                Stats.start( 'total' );

                ctx.clearRect( 0, 0, $canvas.width, $canvas.height );

                if( !document['hidden'] )
                {
                    Stats.start( 'video' );
                    ctx.drawImage( $video, 0, 0, $video.videoWidth, $video.videoHeight, size.x, size.y, size.width, size.height );
                    const frame = ctx.getImageData( 0, 0, $canvas.width, $canvas.height );
                    Stats.stop( 'video' );

                    Stats.start( 'slam' );
                    const frameTime = performance.now();
                    const pose = argus.findCameraPose( frame, frameTime );
                    Stats.stop( 'slam' );

                    if( pose )
                    {
                        scaleEstimator.feedPose( frameTime, pose );

                        if( frameCount % 30 === 0 )
                        {
                            const est = scaleEstimator.estimate();

                            if( est && est.confidence > 0.5 )
                            {
                                metersPerUnit = est.metersPerUnit;
                                scaleConfidence = est.confidence;
                            }
                        }
                    }

                    if( pose )
                    {
                        smoothedCameraPose( pose );

                        if( ++frameCount % 10 === 0 )
                        {
                            refreshPlanes();
                        }
                    }
                    else
                    {
                        view.lostCamera();

                        const dots = argus.getFramePoints();

                        for( const p of dots )
                        {
                            ctx.fillStyle = 'white';
                            ctx.fillRect( p.x, p.y, 2, 2 );
                        }
                    }
                }

                Stats.stop( 'total' );
                Stats.render();

                return true;
            }, 30 );
        }

        setTimeout( () =>
        {
            $splash.remove();

            $start.addEventListener( 'click', async () =>
            {
                $overlay.remove();

                // iOS requires a user-gesture permission request for motion sensors
                try
                {
                    if( typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function' )
                    {
                        await DeviceMotionEvent.requestPermission();
                    }
                }
                catch( e )
                {
                }

                Camera.Initialize( config ).then( media => demo( media ) ).catch( error => alert( 'Camera ' + error ) );

            }, { once: true } );

        }, splashFadeTime );
    }

    // module scripts run after DOM parse; never wait for window 'load' — the
    // CDN import above can finish after that event has already fired
    main();
</script>
</body>
</html>
