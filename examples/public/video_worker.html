<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,shrink-to-fit=no" name="viewport"/>
    <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
    <title>AlvaAR Video (Worker)</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        *:focus {
            outline: none !important
        }

        html,
        body {
            font-family: 'Helvetica', sans-serif;
            width: 100vw;
            height: 100vh;
            font-size: 12px;
            font-weight: 300;
            background: #fff;
        }

        #container {
            padding-bottom: 50px;
            text-align: center;
            display: none;
            position: relative;
            user-select: none;
        }

        #container::after {
            content: "SLAM runs in a Web Worker — click video to add 3d objects";
            text-align: center;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
        }

        #container > div {
            display: inline-flex;
            vertical-align: top;
            margin: 100px 15px 0 15px;
            padding: 0;
            position: relative;
            user-select: none;
            outline: 1px solid #d20000;
        }

        #container > div > canvas {
            position: absolute;
            left: 0;
            top: 0;
            user-select: none;
        }

        #container > div > canvas:first-child {
            display: inline-block;
            position: relative;
        }

        .tracking #container > div {
            outline: 1px solid #bebebe;
        }
    </style>
</head>
<body>
<div id="container">
    <div id="renderer-cam">
        <canvas id="renderer-video"></canvas>
    </div>
    <div id="renderer-map"></div>
</div>
<script type="module">
    import { Stats } from "./assets/stats.js";
    import { ARSimpleView, ARSimpleMap } from "./assets/view.js";
    import { Video, onFrame } from "./assets/utils.js";
    import { AdaptiveQuality } from "./assets/adaptive.js";

    async function main()
    {
        document.body.appendChild( Stats.el );
        Stats.add( 'total' );
        Stats.add( 'video' );

        // worker-side slam time is async, so it gets its own overlay
        const workerStats = document.createElement( 'div' );
        workerStats.style = 'background:rgba(255,255,255,0.8);position:absolute;top:0;right:0;color:black;font:10px Arial,sans-serif;padding:5px;text-align:right;';
        document.body.appendChild( workerStats );

        const slamMsWindow = [];

        const media = await Video.Initialize( './assets/video.mp4' );

        const $cam = document.getElementById( 'renderer-cam' );
        const $map = document.getElementById( 'renderer-map' );
        const ctx = document.getElementById( 'renderer-video' ).getContext( '2d' );

        ctx.canvas.width = media.width;
        ctx.canvas.height = media.height;

        const mapRenderer = new ARSimpleMap( $map, media.width, media.height );
        const camRenderer = new ARSimpleView( $cam, media.width, media.height, mapRenderer );

        // offscreen canvas for (possibly downscaled) SLAM input
        const procCanvas = document.createElement( 'canvas' );
        const procCtx = procCanvas.getContext( '2d', { willReadFrequently: true } );

        let procWidth = media.width;
        let procHeight = media.height;

        const worker = new Worker( './assets/alva_worker.js', { type: 'module' } );

        let workerReady = false;
        let workerBusy = false;

        const adaptive = new AdaptiveQuality( {
            budgetMs: 33,
            scales: [ 1.0, 0.75, 0.5 ],
            onChange: ( scale ) =>
            {
                procWidth = Math.round( media.width * scale / 2 ) * 2;
                procHeight = Math.round( media.height * scale / 2 ) * 2;
                workerReady = false;
                worker.postMessage( { type: 'reconfigure', width: procWidth, height: procHeight } );
                console.log( `[AdaptiveQuality] scale -> ${ scale } (${ procWidth }x${ procHeight })` );
            }
        } );

        worker.onmessage = ( event ) =>
        {
            const msg = event.data;

            if( msg.type === 'ready' )
            {
                workerReady = true;
                workerBusy = false;
                return;
            }

            if( msg.type === 'result' )
            {
                workerBusy = false;

                slamMsWindow.push( msg.ms );
                if( slamMsWindow.length > 30 ) slamMsWindow.shift();
                const avg = slamMsWindow.reduce( ( a, b ) => a + b, 0 ) / slamMsWindow.length;
                workerStats.innerHTML = `slam(worker): ${ avg.toFixed( 1 ) }ms<br/>scale: ${ adaptive.scale } (${ procWidth }x${ procHeight })`;

                adaptive.sample( msg.ms );

                const sx = media.width / procWidth;
                const sy = media.height / procHeight;

                if( msg.pose )
                {
                    camRenderer.updateCameraPose( msg.pose );

                    if( msg.planePose )
                    {
                        camRenderer.createObjectWithPose( msg.planePose );
                    }
                }
                else
                {
                    camRenderer.lostCamera();

                    if( msg.dots )
                    {
                        ctx.fillStyle = 'white';

                        for( const p of msg.dots )
                        {
                            ctx.fillRect( p.x * sx, p.y * sy, 2, 2 );
                        }
                    }
                }
            }
        };

        worker.postMessage( { type: 'init', width: procWidth, height: procHeight, v: new URLSearchParams( location.search ).get( 'v' ) || '0' } );

        $cam.addEventListener( 'click', () => worker.postMessage( { type: 'findPlane' } ) );
        $cam.parentElement.style.display = 'block';

        media.el.play();
        media.el.loop = false;
        media.el.onended = () =>
        {
            media.el.load();
            media.el.play();
            camRenderer.reset();
            worker.postMessage( { type: 'reset' } );
        };

        onFrame( () =>
        {
            Stats.next();
            Stats.start( 'total' );

            Stats.start( 'video' );
            const frame = media.getImageData();
            ctx.clearRect( 0, 0, media.width, media.height );
            ctx.putImageData( frame, 0, 0 );
            Stats.stop( 'video' );

            // backpressure: never queue more than one frame in the worker
            if( workerReady && !workerBusy )
            {
                workerBusy = true;

                let buffer;

                if( procWidth === media.width && procHeight === media.height )
                {
                    buffer = frame.data.buffer;
                }
                else
                {
                    procCanvas.width = procWidth;
                    procCanvas.height = procHeight;
                    procCtx.drawImage( media.el, 0, 0, procWidth, procHeight );
                    buffer = procCtx.getImageData( 0, 0, procWidth, procHeight ).data.buffer;
                }

                worker.postMessage( { type: 'frame', buffer: buffer, width: procWidth, height: procHeight }, [ buffer ] );
            }

            Stats.stop( 'total' );
            Stats.render();

            return true;
        }, 30 );
    }

    window.addEventListener( 'load', main );
</script>
</body>
</html>
