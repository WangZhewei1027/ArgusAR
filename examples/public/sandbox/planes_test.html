<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>ArgusAR Planes Pipeline Test</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=">
    <style>
        body { font: 12px monospace; padding: 16px; }
        #out { white-space: pre-wrap; }
    </style>
</head>
<body>
<div id="out">running…</div>
<div id="viz" style="position:relative; margin-top:10px;"></div>
<script type="module">
    import * as THREE from 'https://threejsfundamentals.org/threejs/resources/threejs/r132/build/three.module.js';
    import { Video } from "../assets/utils.js";
    import { ArgusARConnectorTHREE } from '../assets/argus_ar_three.js';

    // Deterministic, visibility-independent verification of the Phase 2 plane
    // pipeline: seek-driven playback -> SLAM -> getPlanes/hitTest, plus a
    // manually-rendered three.js pass with pixel-level polygon counting
    // (no rAF anywhere — works in hidden panes).

    const wasmVersion = new URLSearchParams( location.search ).get( 'v' ) || 'b6';
    const { ArgusAR } = await import( `../assets/argus_ar.js?v=${ wasmVersion }` );

    const PALETTE = [ 0x4dabf7, 0x51cf66, 0xffd43b, 0xff6b6b, 0xb197fc, 0xf783ac, 0x63e6be, 0xffa94d ];
    const applyPose = ArgusARConnectorTHREE.Initialize( THREE );

    function buildPlaneGroup( plane )
    {
        const color = PALETTE[plane.id % PALETTE.length];
        const group = new THREE.Group();
        group.planeViz = true;

        if( plane.hull.length >= 3 )
        {
            const verts = plane.hull.map( p => new THREE.Vector3( p.u, 0, p.v ) );
            const positions = [];

            for( let i = 1; i < verts.length - 1; i++ )
            {
                positions.push( verts[0].x, verts[0].y, verts[0].z );
                positions.push( verts[i].x, verts[i].y, verts[i].z );
                positions.push( verts[i + 1].x, verts[i + 1].y, verts[i + 1].z );
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute( 'position', new THREE.Float32BufferAttribute( positions, 3 ) );

            group.add( new THREE.Mesh( geo, new THREE.MeshBasicMaterial( { color: color, transparent: true, opacity: 0.5, side: THREE.DoubleSide, depthWrite: false } ) ) );
        }

        applyPose( plane.pose, group.quaternion, group.position );

        return group;
    }

    const $out = document.getElementById( 'out' );

    const params = new URLSearchParams( location.search );
    const videoFile = params.get( 'video' ) || 'video.mp4';

    // frame-sequence mode: ?frames=<dir>&count=N loads pre-extracted JPEGs
    // instead of seeking a <video> — hidden panes throttle video decoding for
    // some files, silently freezing seek-driven playback
    const framesDir = params.get( 'frames' );
    const framesCount = parseInt( params.get( 'count' ) || '0', 10 );

    let media;

    if( framesDir )
    {
        // NOTE: hidden panes defer Image.decode(), throttle img.onload AND
        // pace sequential background fetches — so prefetch ALL frames up
        // front with high concurrency, then decode locally per frame
        $out.textContent = 'prefetching frames…';

        const blobs = new Array( framesCount );

        const CONC = 32;

        for( let base = 0; base < framesCount; base += CONC )
        {
            await Promise.all( Array.from( { length: Math.min( CONC, framesCount - base ) }, ( _, k ) =>
                fetch( `../assets/${ framesDir }/f_${ String( base + k + 1 ).padStart( 4, '0' ) }.jpg` )
                    .then( r => r.blob() )
                    .then( b => blobs[base + k] = b ) ) );
        }

        const loadImage = ( i ) => createImageBitmap( blobs[i] );

        const first = await loadImage( 0 );

        const fCanvas = document.createElement( 'canvas' );
        fCanvas.width = first.width;
        fCanvas.height = first.height;
        const fCtx = fCanvas.getContext( '2d', { willReadFrequently: true } );

        media = {
            width: first.width,
            height: first.height,
            el: { duration: framesCount / 30, pause() {}, set loop( v ) {}, set onseeked( f ) {} },
            async seekFrame( i )
            {
                const bmp = await loadImage( i );
                fCtx.drawImage( bmp, 0, 0 );
                bmp.close();
            },
            getImageData()
            {
                return fCtx.getImageData( 0, 0, fCanvas.width, fCanvas.height );
            }
        };
    }
    else
    {
        // version tag on the video too — same-URL content swaps otherwise serve stale cache
        media = await Video.Initialize( `../assets/${ videoFile }?v=${ wasmVersion }` );
    }

    const argus = await ArgusAR.Initialize( media.width, media.height );

    if( new URLSearchParams( location.search ).get( 'debug' ) )
    {
        argus.system.setDebug( true );
    }

    media.el.pause();
    media.el.loop = false;

    const seekTo = ( t ) => new Promise( ( resolve ) =>
    {
        media.el.onseeked = () => resolve();
        media.el.currentTime = t;
    } );

    // manual three.js pass, rendered per-frame without rAF
    const renderer = new THREE.WebGLRenderer( { antialias: false, alpha: true, preserveDrawingBuffer: true } );
    renderer.setClearColor( 0, 0 );
    renderer.setSize( media.width, media.height );

    const camera3 = new THREE.PerspectiveCamera( 75, media.width / media.height, 0.1, 1000 );
    camera3.rotation.reorder( 'YXZ' );

    const scene = new THREE.Scene();
    scene.add( camera3 );

    const $viz = document.getElementById( 'viz' );
    const vidCanvas = document.createElement( 'canvas' );
    vidCanvas.width = media.width;
    vidCanvas.height = media.height;
    const vidCtx = vidCanvas.getContext( '2d' );
    vidCanvas.style.cssText = 'position:absolute;top:0;left:0;';
    renderer.domElement.style.cssText = 'position:absolute;top:0;left:0;';
    $viz.style.height = media.height + 'px';
    $viz.appendChild( vidCanvas );
    $viz.appendChild( renderer.domElement );

    let planeGroups = [];

    const fps = 30;
    const timeline = [];
    const lostKpCounts = [];
    let tracked = 0;
    let frames = 0;

    // pingpong mode: play forward then backward — an exact revisit of every
    // viewpoint, the deterministic acceptance test for loop closing
    const pingpong = !!params.get( 'pingpong' );
    const baseFrames = framesDir ? framesCount : Math.floor( media.el.duration * fps );
    const totalFrames = pingpong ? baseFrames * 2 - 1 : baseFrames;

    for( let fi = 0; fi < totalFrames; fi++ )
    {
        const frameIdx = ( fi < baseFrames ) ? fi : ( 2 * baseFrames - 2 - fi );

        if( framesDir )
        {
            await media.seekFrame( frameIdx );
        }
        else
        {
            await seekTo( 0.001 + frameIdx / fps );
        }

        const frame = media.getImageData();
        const pose = argus.findCameraPose( frame );

        if( pose )
        {
            tracked++;
            applyPose( pose, camera3.quaternion, camera3.position );
        }
        else
        {
            lostKpCounts.push( argus.getFramePoints().length );
        }

        frames++;

        if( frames % 10 === 0 )
        {
            const planes = argus.getPlanes();

            planeGroups.forEach( g => scene.remove( g ) );
            planeGroups = planes.map( p => { const g = buildPlaneGroup( p ); scene.add( g ); return g; } );

            timeline.push( {
                frame: frames,
                planes: planes.map( p => ( { id: p.id, type: p.type, inliers: p.inliers, hull: p.hull.length } ) )
            } );

            if( frames % 60 === 0 )
            {
                $out.textContent = `frame ${ frames }, planes: ${ planes.length }`;
            }
        }

        vidCtx.putImageData( frame, 0, 0 );
        renderer.render( scene, camera3 );
    }

    // pixel-level check: how much of the final render is plane-colored
    const shot = document.createElement( 'canvas' );
    shot.width = media.width;
    shot.height = media.height;
    const shotCtx = shot.getContext( '2d' );
    shotCtx.drawImage( renderer.domElement, 0, 0 );
    const px = shotCtx.getImageData( 0, 0, shot.width, shot.height ).data;

    let coloredPixels = 0;

    for( let i = 0; i < px.length; i += 4 )
    {
        if( px[i + 3] > 30 ) coloredPixels++;
    }

    const coloredRatio = coloredPixels / ( shot.width * shot.height );

    const finalPlanes = argus.getPlanes();

    // hit-test a grid of pixels; count hits
    const hits = [];

    for( const [ px, py ] of [ [ 0.5, 0.5 ], [ 0.5, 0.75 ], [ 0.25, 0.6 ], [ 0.75, 0.6 ], [ 0.5, 0.25 ] ] )
    {
        const hit = argus.hitTest( px * media.width, py * media.height );
        hits.push( hit ? { at: [ px, py ], planeId: hit.planeId, pos: [ +hit.pose[12].toFixed( 3 ), +hit.pose[13].toFixed( 3 ), +hit.pose[14].toFixed( 3 ) ] } : { at: [ px, py ], planeId: 0 } );
    }

    // id stability: how often did each id appear across the timeline
    const idSeen = {};

    for( const snap of timeline )
    {
        for( const p of snap.planes )
        {
            idSeen[p.id] = ( idSeen[p.id] || 0 ) + 1;
        }
    }

    const result = {
        video: framesDir || videoFile,
        frames: frames,
        trackedRatio: +( tracked / frames ).toFixed( 3 ),
        loopStats: argus.getLoopStats(),
        meanKeypointsWhileLost: lostKpCounts.length ? +( lostKpCounts.reduce( ( a, b ) => a + b, 0 ) / lostKpCounts.length ).toFixed( 1 ) : null,
        renderedPlanePixelRatio: +coloredRatio.toFixed( 4 ),
        finalPlanes: finalPlanes.map( p => ( {
            id: p.id, type: p.type, inliers: p.inliers,
            hullPoints: p.hull.length,
            extent: { u: +p.extent.u.toFixed( 3 ), v: +p.extent.v.toFixed( 3 ) },
            normalY: +p.pose[5].toFixed( 3 )
        } ) ),
        idPersistence: idSeen,
        snapshots: timeline.length,
        hitTests: hits
    };

    window.__result = result;
    $out.textContent = 'DONE\n' + JSON.stringify( result, null, 2 );
    document.title = 'Planes Test DONE';
</script>
</body>
</html>
